<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F2EEE6" />
  <title>KindCue — Visual Schedules &amp; Social Stories</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* surface */
      --bg:        #F2EEE6;
      --bg-tint:   #ECE6DA;
      --paper:    #FFFFFF;
      --hairline:  #E5DECE;
      --hairline-strong: #D8CFBB;

      /* ink */
      --ink:       #2A2E2A;
      --ink-2:     #5A6058;
      --ink-3:     #8A8E83;
      --ink-mute:  #B1B3A8;

      /* sage — primary */
      --sage:      #6F926F;
      --sage-deep: #3D4A3D;
      --sage-soft: #E4ECDE;
      --sage-tint: #F0F4EB;

      /* category — gentle WCAG-safe */
      --cat-routine:    #6F926F;  --cat-routine-bg:   #E4ECDE;
      --cat-hygiene:    #7B9DB3;  --cat-hygiene-bg:   #E2EBF1;
      --cat-school:     #B68A56;  --cat-school-bg:    #F0E4D1;
      --cat-social:     #9783B0;  --cat-social-bg:    #E8E0F0;
      --cat-food:       #B97A6F;  --cat-food-bg:      #F0DDD9;
      --cat-calm:       #8B8B7E;  --cat-calm-bg:      #E8E5DC;

      /* radii / shadows */
      --r-xs: 6px;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;

      --shadow-card: 0 1px 0 rgba(122,108,80,.04), 0 1px 3px rgba(48,40,20,.04);
      --shadow-pop:  0 1px 0 rgba(122,108,80,.04), 0 8px 28px rgba(48,40,20,.10);

      --font-sans: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, sans-serif;

      --space: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html {
      /* iOS Safari: prevent text size adjustment when rotating to landscape */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      /* iOS Safari: soft tap highlight handled per-element instead */
      -webkit-tap-highlight-color: transparent;
      /* Honor the iPhone notch / Dynamic Island */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      /* Prevent double-tap zoom on iOS */
      touch-action: manipulation;
    }
    /* 16px minimum input font size — iOS Safari auto-zooms on focus
       when the input's font is smaller than that. */
    input, textarea, select {
      font-family: inherit;
      color: inherit;
      font-size: 16px;
    }
    @media (min-width: 768px) {
      input, textarea, select { font-size: 15px; }
    }
    img { max-width: 100%; }

    /* App shell -------------------------------------------------------- */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      /* Modern browsers honor dynamic viewport — gives us the right height
         on iOS Safari when the URL bar collapses/expands. */
      min-height: 100dvh;
    }
    .app.child-mode { min-width: 0; }

    /* Responsive grids ------------------------------------------------- */
    /* Cards laid out via auto-fill stay readable on every viewport. */
    .grid-cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .grid-cards--lg { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .grid-tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    /* Step canvas — 4 cols at desktop, scales down naturally.
       `minmax(0, 1fr)` (not bare `1fr`) keeps every column equal regardless of
       content: with `1fr` the implicit min is `min-content`, so a step whose
       title has a long unbreakable word can force its column wider and
       starve the others. */
    .grid-steps { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch; }
    @media (max-width: 1080px) { .grid-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px)  { .grid-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }

    /* Builder workspace — 3 cols on desktop, single column with drawers
       on tablet/phone. The rails get pulled out of the grid and
       absolutely positioned when in drawer mode. */
    .builder-workspace {
      flex: 1; min-height: 0; min-width: 0;
      display: grid;
      grid-template-columns: 264px 1fr 320px;
    }
    .builder-rail-left, .builder-rail-right { min-height: 0; }

    @media (max-width: 1080px) {
      .builder-workspace { grid-template-columns: 1fr; position: relative; }
      .builder-rail-left, .builder-rail-right {
        position: fixed; top: 0; bottom: 0; z-index: 80;
        width: min(86vw, 340px);
        background: var(--paper);
        box-shadow: 0 0 60px rgba(20,18,14,.25);
        transform: translateX(-110%);
        transition: transform .22s cubic-bezier(.3,.7,.4,1);
        display: flex !important;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .builder-rail-right { left: auto; right: 0; transform: translateX(110%); }
      .builder-rail-left.open  { transform: translateX(0); }
      .builder-rail-right.open { transform: translateX(0); }
      .builder-rail-scrim {
        position: fixed; inset: 0; z-index: 79;
        background: rgba(20,18,14,.4);
        opacity: 0; pointer-events: none;
        transition: opacity .2s;
      }
      .builder-rail-scrim.open { opacity: 1; pointer-events: auto; }
    }
    @media (min-width: 1081px) {
      .builder-rail-scrim, .builder-drawer-only { display: none !important; }
    }
    @media (max-width: 1080px) {
      .builder-desktop-only { display: none !important; }
    }

    /* Print preview: settings rail collapses to a top strip on tablet. */
    @media (max-width: 900px) {
      .print-layout { grid-template-columns: 1fr !important; }
      .print-settings { border-right: 0 !important; border-bottom: 1px solid var(--hairline); }
    }
    /* On phones the printable page shrinks — make padding tighter so
       the user can still preview it without big margins eating space. */
    @media (max-width: 720px) {
      .print-paper { padding: 28px 22px !important; }
    }

    /* Top nav responsive bits */
    @media (max-width: 640px) {
      .topnav-brand-name { display: none; }
      .topnav-child-age { display: none; }
      .topnav { padding: 10px 12px !important; gap: 10px !important; }
      .topnav-sep { display: none !important; }
      .topnav-link { padding: 0 10px !important; font-size: 13px !important; height: 32px !important; }
    }

    /* Topbar (page sub-header) wraps on narrow screens */
    @media (max-width: 720px) {
      .topbar { padding: 10px 14px !important; flex-wrap: wrap; gap: 8px !important; }
      .topbar .h1 { font-size: 18px !important; white-space: normal !important; }
      .topbar .h2 { font-size: 15px !important; white-space: normal !important; }
      .topbar .btn { height: 36px !important; padding: 0 12px !important; font-size: 13px !important; }
      .topbar .meta { font-size: 11.5px !important; }
    }

    /* Page padding shrinks at small sizes */
    @media (max-width: 720px) {
      .page-pad { padding: 14px 14px 32px !important; }
      .page-head { padding: 16px 14px 12px !important; flex-wrap: wrap !important; gap: 10px !important; }
      .page-head .display { font-size: 22px !important; }
    }

    /* Modal: full-screen on phones, comfy card on tablet+ */
    @media (max-width: 720px) {
      .modal-shell {
        width: 100vw !important; height: 100dvh !important; max-height: 100dvh !important;
        max-width: 100vw !important; border-radius: 0 !important;
      }
      .modal-overlay { padding: 0 !important; }
      .modal-grid { grid-template-columns: 1fr !important; }
    }

    /* Collapse button labels on narrow screens — keep icons only. */
    @media (max-width: 560px) {
      .topbar .btn .btn-label,
      .page-head .btn .btn-label { display: none; }
      .topbar .btn,
      .page-head .btn { padding: 0 10px !important; min-width: 36px; }
    }

    /* Home page responsive bits */
    @media (max-width: 820px) {
      .today-grid { grid-template-columns: 1fr !important; }
      .today-tiles { border-left: 0 !important; border-top: 1px solid var(--hairline); }
    }
    @media (max-width: 640px) {
      /* Collapse list-row board cards to 2 lines on phone */
      .row-board {
        grid-template-columns: 40px minmax(0, 1fr) auto !important;
        gap: 12px !important;
      }
      .row-board > :nth-child(3),  /* category pill */
      .row-board > :nth-child(4) { /* progress */
        display: none !important;
      }
    }

    /* Image search results grid — 4 cols at desktop, scales down. */
    .grid-search-results {
      display: grid; gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    @media (max-width: 900px) { .grid-search-results { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .grid-search-results { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }

    /* Image-picker tab bar — scrolls horizontally on phones rather than
       wrapping, so the row stays readable. */
    @media (max-width: 600px) {
      .modal-tabs button { flex: 0 0 auto !important; min-width: 0 !important; padding: 10px 12px !important; }
    }

    /* Reusable type --------------------------------------------------- */
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink-3);
    }
    .display { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; color: var(--ink); }
    .h1 { font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -.005em; color: var(--ink); margin: 0; }
    .h2 { font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ink); margin: 0; }
    .h3 { font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--ink); margin: 0; }
    .meta { font-size: 13px; color: var(--ink-2); }
    .muted { color: var(--ink-3); }

    /* Buttons --------------------------------------------------------- */
    .btn {
      appearance: none; border: 0; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 14px; border-radius: 999px;
      font: inherit; font-weight: 700; font-size: 14px;
      transition: background .12s, transform .08s, box-shadow .12s, color .12s;
    }
    .btn:active { transform: translateY(1px); }
    .btn--primary { background: var(--sage-deep); color: #fff; }
    .btn--primary:hover { background: #2F392F; }
    .btn--ghost { background: transparent; color: var(--ink); }
    .btn--ghost:hover { background: rgba(0,0,0,.04); }
    .btn--soft { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hairline); }
    .btn--soft:hover { background: #fbf9f4; box-shadow: inset 0 0 0 1px var(--hairline-strong); }
    .btn--sage { background: var(--sage-soft); color: var(--sage-deep); }
    .btn--sage:hover { background: #D8E3D2; }
    .btn--icon { width: 36px; padding: 0; justify-content: center; }
    .btn--lg { height: 44px; padding: 0 18px; font-size: 15px; }
    .btn--xl { height: 56px; padding: 0 28px; font-size: 17px; border-radius: 999px; }

    .btn svg { width: 16px; height: 16px; }
    .btn--lg svg { width: 18px; height: 18px; }
    .btn--xl svg { width: 22px; height: 22px; }

    /* Cards ----------------------------------------------------------- */
    .card {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
    }

    /* Chips ----------------------------------------------------------- */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 12px;
      border-radius: 999px;
      background: var(--paper);
      box-shadow: inset 0 0 0 1px var(--hairline);
      font-size: 13px; font-weight: 700; color: var(--ink-2);
      cursor: pointer;
      transition: background .12s, color .12s, box-shadow .12s;
    }
    .chip--active { background: var(--sage-deep); color: #fff; box-shadow: none; }
    .chip--cat { background: var(--cat-bg, var(--sage-tint)); color: var(--cat-ink, var(--sage-deep)); box-shadow: none; }

    /* Inputs ---------------------------------------------------------- */
    .input {
      appearance: none; width: 100%; height: 38px; padding: 0 12px;
      border: 1px solid var(--hairline); border-radius: var(--r-sm);
      background: var(--paper); font: inherit; color: var(--ink);
      outline: none;
      transition: border-color .12s, box-shadow .12s;
    }
    .input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(111,146,111,.18); }
    .textarea { min-height: 90px; padding: 10px 12px; resize: vertical; line-height: 1.5; }

    /* Sidebar --------------------------------------------------------- */
    .sidebar {
      background: var(--bg-tint);
      border-right: 1px solid var(--hairline);
      padding: 22px 16px;
      display: flex; flex-direction: column; gap: 18px;
      position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--sage-deep);
      display: grid; place-items: center; color: #fff;
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }

    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 9px;
      color: var(--ink-2); font-size: 14px; font-weight: 700;
      cursor: pointer; border: 0; background: transparent;
      width: 100%; text-align: left;
    }
    .nav-item:hover { background: rgba(0,0,0,.04); color: var(--ink); }
    .nav-item--active { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-card); }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .nav-section {
      font-size: 10.5px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink-3);
      padding: 8px 10px 4px;
    }

    /* Topbar ---------------------------------------------------------- */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--hairline);
      background: rgba(242,238,230,.85);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar .spacer { flex: 1; }
    .topbar .btn { flex-shrink: 0; }
    .topbar .h1, .topbar .h2 { white-space: nowrap; }

    /* Scrollers ------------------------------------------------------- */
    .scroll { overflow-y: auto; }
    .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.10); border-radius: 999px; border: 2px solid var(--bg); background-clip: content-box; }
    .scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.18); border: 2px solid var(--bg); background-clip: content-box; }

    /* Drag handle indicator ------------------------------------------ */
    .drag-grip {
      display: grid; grid-template-columns: 2px 2px; gap: 2px;
      width: 10px;
    }
    .drag-grip i { width: 2px; height: 2px; border-radius: 50%; background: var(--ink-mute); display: block; }
    .drag-grip i:nth-child(n) { height: 2px; }

    /* Pill / status --------------------------------------------------- */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px; border-radius: 999px;
      background: var(--sage-soft); color: var(--sage-deep);
      font-size: 12px; font-weight: 700;
    }
    .pill--ghost { background: rgba(0,0,0,.04); color: var(--ink-2); }
    .pill--dot::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }

    /* Activity card (the step in a board) ---------------------------- */
    .step-card {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color .12s, box-shadow .12s, transform .08s;
      cursor: pointer;
    }
    .step-card:hover { border-color: var(--hairline-strong); box-shadow: var(--shadow-pop); }
    .step-card--selected {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(111,146,111,.18), var(--shadow-card);
    }
    .step-art {
      aspect-ratio: 4 / 3;
      background: var(--cat-bg, var(--sage-soft));
      color: var(--cat-ink, var(--sage-deep));
      display: grid; place-items: center;
      position: relative;
    }
    .step-art svg { width: 56%; height: 56%; }
    .step-meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
    .step-title {
      font-size: 16px; font-weight: 700; color: var(--ink);
      /* Reserve room for a wrapped second line so every card's title
         block is the same height — keeps the grid row uniform. */
      min-height: 22px;
      overflow-wrap: break-word; word-break: break-word;
    }
    .step-sub { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
    .step-num {
      position: absolute; top: 8px; left: 10px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,255,255,.85);
      color: var(--cat-ink, var(--ink));
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    /* Utilities ------------------------------------------------------- */
    .row { display: flex; align-items: center; gap: 10px; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .stack-tight { display: flex; flex-direction: column; gap: 4px; }
    .grow { flex: 1; }
    .hairline { height: 1px; background: var(--hairline); }
  </style>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head>
